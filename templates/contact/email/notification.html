<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>New contact submission</title></head>
<body style="font-family: -apple-system, Segoe UI, sans-serif; background:#f6f8ff; margin:0; padding:30px;">
  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:600px; margin:0 auto; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,0.08);">
    <tr>
      <td style="background:linear-gradient(135deg,#1f67ff,#4f46e5,#8b5cf6); padding:24px 30px;">
        <h1 style="margin:0; color:#fff; font-size:20px;">New Portfolio Inquiry</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:30px;">
        <p style="margin:0 0 8px; color:#56607a; font-size:13px; text-transform:uppercase; letter-spacing:0.08em;">From</p>
        <p style="margin:0 0 18px; font-size:16px; color:#0a0f1e;"><strong>{{ submission.name }}</strong> &lt;<a href="mailto:{{ submission.email }}" style="color:#1f67ff;">{{ submission.email }}</a>&gt;</p>

        {% if submission.subject %}
        <p style="margin:0 0 8px; color:#56607a; font-size:13px; text-transform:uppercase; letter-spacing:0.08em;">Subject</p>
        <p style="margin:0 0 18px; font-size:16px; color:#0a0f1e;">{{ submission.subject }}</p>
        {% endif %}

        <p style="margin:0 0 8px; color:#56607a; font-size:13px; text-transform:uppercase; letter-spacing:0.08em;">Message</p>
        <div style="padding:18px; background:#f6f8ff; border-radius:10px; border-left:3px solid #1f67ff; color:#1e2640; line-height:1.6; white-space:pre-wrap;">{{ submission.message }}</div>

        <p style="margin:24px 0 0; color:#56607a; font-size:13px;">Received {{ submission.created_at|date:"M d, Y · H:i" }} · Reply directly to respond.</p>
      </td>
    </tr>
  </table>
</body>
</html>
